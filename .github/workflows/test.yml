name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: coffee_test
          POSTGRES_PASSWORD: local_ci_only
          POSTGRES_DB: coffee_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      COFFEE_TEST_POSTGRES_DSN: postgresql://coffee_test:local_ci_only@localhost:5432/coffee_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装依赖
        run: pip install -r requirements.txt -r requirements-cloud.txt pytest
      - name: 运行测试
        run: python -m pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 检查定位与新建体验草稿
        run: node --test test_location.mjs test_amap_location.mjs test_journal.mjs test_menu_drafts.mjs

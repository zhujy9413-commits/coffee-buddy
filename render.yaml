services:
  - type: web
    name: coffee-buddy-test
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeployTrigger: "off"
    healthCheckPath: /healthz
    envVars:
      # Persistent mode requires a separately approved paid disk upgrade.
      - key: COFFEE_STORAGE_MODE
        value: ephemeral
      - key: AMAP_API_KEY
        sync: false
